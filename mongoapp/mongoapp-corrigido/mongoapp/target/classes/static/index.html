<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciamento de Usuários</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>Cadastro de Usuários</h1>

  <form id="userForm" novalidate>
    <input type="hidden" id="userId">
    <input type="text" id="nome" placeholder="Nome" maxlength="100" required>
    <input type="email" id="email" placeholder="Email" maxlength="254" required>
    <button type="submit">Salvar</button>
    <button type="button" id="btnNovo">Novo Usuário</button>
  </form>

  <p id="msg" role="alert"></p>

  <table>
    <thead>
      <tr><th>Nome</th><th>Email</th><th>Ações</th></tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>

  <div class="paginacao">
    <button type="button" id="btnAnterior">Anterior</button>
    <span id="paginaInfo"></span>
    <button type="button" id="btnProxima">Próxima</button>
  </div>

  <script src="/app.js"></script>
</body>
</html>
